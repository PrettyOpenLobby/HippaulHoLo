# Run the published images instead of building. Apply ON TOP of
# docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# (or COMPOSE_FILE=docker-compose.yml:docker-compose.ghcr.yml in .env, then
# plain `docker compose up -d`). This override is applied after OpenLobby's
# two files (README, "Without building"). For both PS2 titles set
# HIPPAULHOLO_TAG=with-hippaulmaster and POL_TITLES=tmtitle,jantitle. Needs
# Docker Compose 2.24 or newer (the `!reset` that drops the build step).

services:
  login:
    image: ghcr.io/prettyopenlobby/hippaulholo:${HIPPAULHOLO_TAG:-${CRYSTALHOLO_TAG:-latest}}
    pull_policy: missing
    build: !reset null
  authsess:
    image: ghcr.io/prettyopenlobby/hippaulholo:${HIPPAULHOLO_TAG:-${CRYSTALHOLO_TAG:-latest}}
    pull_policy: missing
  jan:
    image: ghcr.io/prettyopenlobby/hippaulholo:${HIPPAULHOLO_TAG:-${CRYSTALHOLO_TAG:-latest}}
    pull_policy: missing
  board:
    image: ghcr.io/prettyopenlobby/hippaulholo:${HIPPAULHOLO_TAG:-${CRYSTALHOLO_TAG:-latest}}
    pull_policy: missing
