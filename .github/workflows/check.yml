name: checks
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scanner self-test (positive controls)
        run: python check.py --selftest
      - name: repository hygiene scan
        run: python check.py
  selftests:
    runs-on: ubuntu-latest
    steps:
      # the title runs inside the OpenLobby core, so its suites need the
      # core checked out beside it (tools/jan_testenv.py finds ../openlobby)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: crystalholo
      - uses: actions/checkout@v4
        with:
          repository: PrettyOpenLobby/OpenLobby
          path: openlobby
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # polcore's drivers: the database suites run on throwaway PostgreSQL and
      # Valkey containers (Docker is on the runner), and must not skip here
      - run: pip install pyyaml pycryptodome pillow "psycopg[binary]" psycopg-pool valkey
      - run: python tools/jan_run_all.py
        working-directory: crystalholo
        env:
          POL_TEST_REQUIRE_DB: "1"
